name: Deploy PitchPulse demo

on:
  push:
    branches: [main]
    paths:
      - football_tracker_dashboard_demo.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare standalone demo
        run: |
          mkdir -p _site
          cp football_tracker_dashboard_demo.html _site/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
